    margin: 25px 0;
}

    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
}

#cargando {
    display: none;

    overflow: hidden;
    margin-top: 20px;
}

.progreso {
    width: 0%;
    height: 100%;
    background: #e91e63;
    transition: width 0.1s;
}
